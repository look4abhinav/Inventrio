[project]
name = "inventrio"
version = "0.1.0"
description = "AI-powered pharmacy inventory manager (Pydantic AI learning project)"
readme = "README.md"
authors = [
    { name = "Abhinav Srivastava", email = "look4abhinav@outlook.in" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-ai[openai]>=2.31.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
inventrio = "inventrio.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
